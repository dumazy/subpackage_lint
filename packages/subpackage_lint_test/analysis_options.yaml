analyzer:
  plugins:
    - custom_lint

custom_lint:
  debug: true
  verbose: true
  rules:
    - avoid_src_import_from_other_subpackage:
      directories:
        - "lib"
      exclude:
        - "lib/excluded/*.dart"
    - avoid_src_import_from_same_package:
      directories:
        - "lib"
      exclude:
        - "lib/excluded/**"
    - avoid_package_import_for_same_package:
      directories:
        - "lib"
      exclude:
        - "lib/excluded/**"
